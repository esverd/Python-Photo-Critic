<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Review</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <h1>AI Photo Review</h1>
        <button id="finalize-button" class="finalize-btn">Finalize Selections & Close</button>
    </header>
    <main>
        <div id="gallery-view" class="gallery-grid">
            </div>
    </main>

    <div id="modal-view" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button class="modal-close-btn">&times;</button>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modal-image" src="" alt="Detailed view of the photo">
                </div>
                <div class="modal-details-container">
                    <h4 id="modal-title"></h4>
                    <p id="modal-score-status"></p>
                    <p id="modal-date"></p>
                    
                    <h5>Summary</h5>
                    <p id="modal-summary"></p>
                    
                    <h5>Objective Description</h5>
                    <blockquote id="modal-description"></blockquote>
                    
                    <h5>Critical Assessment</h5>
                    <blockquote id="modal-assessment"></blockquote>
                    
                    <div id="modal-actions" class="modal-actions">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
